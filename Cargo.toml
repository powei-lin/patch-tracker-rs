[package]
name = "patch-tracker"
version = "0.4.0"
edition = "2024"
authors = ["Powei Lin <poweilin1994@gmail.com>"]
readme = "README.md"
license = "MIT OR Apache-2.0"
description = "Patch tracker"
homepage = "https://github.com/powei-lin/patch-tracker-rs"
repository = "https://github.com/powei-lin/patch-tracker-rs"
keywords = ["opticalflow"]
categories = ["science", "mathematics"]
exclude = [
    "docs/*.avif",
    "examples/*",
    "benches/*",
    "tests/*",
]

[lib]
name = "patch_tracker"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "rayon"] }
log = "0.4.22"
nalgebra = { version = "0.34", optional = true }
nalgebra_033 = { package = "nalgebra", version = "0.33", optional = true }
rayon = "1.10.0"
wide = "1.2.0"
pyo3 = { version = "0.28", features = ["extension-module", "abi3", "abi3-py310"], optional = true }
numpy = { version = "0.28", optional = true }
ort = { version = "2.0.0-rc.12", features = ["coreml"], optional = true }

[features]
default = ["nalgebra034"]
nalgebra033 = ["dep:nalgebra_033"]
nalgebra034 = ["dep:nalgebra"]
python = ["dep:pyo3", "dep:numpy", "nalgebra034"]
magic_point = ["dep:ort"]


[dev-dependencies]
env_logger = "0.11"
glob = "0.3.1"
clap = { version = "4.6", features = ["derive"] }
rerun = "0.30.2"
diol = "0.13.1"
fastrand = "2.3.0"


[[example]]
name = "single_camera"
path = "examples/single_camera.rs"
required-features = ["magic_point"]

[[example]]
name = "stereo_camera"
path = "examples/stereo_camera.rs"
required-features = ["magic_point"]

[[bench]]
name = "image_pyramid"
harness = false

[[bench]]
name = "tracker"
harness = false
